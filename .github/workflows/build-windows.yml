name: Build Windows executable

# Builds a standalone Windows .exe (with ffmpeg bundled in) and publishes it.
# - Every push to main / manual run: the .exe is uploaded as a build artifact.
# - Pushing a version tag (e.g. v0.1.0): the .exe is also attached to a GitHub
#   Release so people can download it directly.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11 still ships the legacy 'imp' module that Blackmagic's
          # DaVinciResolveScript.py imports (removed in 3.12+). Building on a
          # newer Python breaks the Resolve connection at import time.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download and vendor ffmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          $ffmpeg = Get-ChildItem -Recurse -Path ffmpeg_dl -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse -Path ffmpeg_dl -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName vendor\ffmpeg.exe
          Copy-Item $ffprobe.FullName vendor\ffprobe.exe

      - name: Build the executable
        run: pyinstaller autocut.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaVinciAutoCut-windows
          path: dist/DaVinciAutoCut.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DaVinciAutoCut.exe
