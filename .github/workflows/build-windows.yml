name: Build Windows installer

# Builds DaVinciAutoCut-Setup.exe (Inno Setup), with ffmpeg bundled in, and
# publishes it.
# - Push to main / manual run: uploaded as a build artifact.
# - Push a version tag (e.g. v0.2.0): also attached to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compute version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.2.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Download and vendor ffmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          New-Item -ItemType Directory -Force -Path installer\vendor | Out-Null
          $ffmpeg = Get-ChildItem -Recurse -Path ffmpeg_dl -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse -Path ffmpeg_dl -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName installer\vendor\ffmpeg.exe
          Copy-Item $ffprobe.FullName installer\vendor\ffprobe.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        working-directory: installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" /DFFmpegDir=vendor davinci-autocut.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaVinciAutoCut-Setup
          path: installer/output/DaVinciAutoCut-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/DaVinciAutoCut-Setup.exe
